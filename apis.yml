name: Clever Care Health Plan
description: >-
  Clever Care Health Plan is a California Medicare Advantage (HMO and HMO C-SNP)
  insurer that blends Eastern and Western medicine for seniors. For developers it
  publishes an HL7 FHIR R4 (4.0.1) API implementing the CMS Interoperability and
  Patient Access final rule (CMS-9115-F): a secured Patient Access API (Patient,
  Coverage, and CARIN Blue Button ExplanationOfBenefit) protected with
  SMART-on-FHIR OAuth 2.0 / OpenID Connect, plus public, rate-limited Provider
  Directory and Drug Formulary APIs. The FHIR server runs on WSO2 Open Healthcare
  with a developer portal for app registration and API subscription.
